# Model manifest for VeriAudit v2 (protocol §7, amended 2026-11-13).
# `confirmatory: true` models form the H1/H2 test families (4 models x 3 forms = 12 tests each);
# the family is fixed in advance and the analysis refuses to run if a confirmatory model is missing.
# `revision` MUST be pinned to the 40-hex commit hash on first download; the runner refuses
# unpinned Hugging Face models. Repo ids / licences below were checked on the model cards on
# 2026-11-13 unless marked otherwise.
models:
  - key: qwen3_8b
    role: historical baseline (v0.1)
    confirmatory: true
    backend: vllm
    model_id: Qwen/Qwen3-8B
    revision: null            # PIN at download
    chat_template_kwargs: {enable_thinking: false}
    licence: Apache-2.0
    declared_urdu_support: "unclear - 119 languages/dialects claimed; Urdu not confirmed in the report text read"
  - key: aya_expanse_8b
    role: historical baseline (v0.1)
    confirmatory: true
    backend: vllm
    model_id: CohereLabs/aya-expanse-8b
    revision: null            # PIN at download
    licence: CC-BY-NC-4.0 (non-commercial; gated on Hugging Face)
    hf_gated: true
    declared_urdu_support: "no - 23 languages, Hindi yes, Urdu no"
  - key: qwen3_5_9b
    role: newer Qwen family
    confirmatory: true
    backend: vllm
    model_id: Qwen/Qwen3.5-9B   # post-trained (chat) model; card checked 2026-11-13
    revision: null            # PIN at download
    chat_template_kwargs: {enable_thinking: false}   # thinking is ON by default for Qwen3.5
    licence: Apache-2.0
    declared_urdu_support: "unclear - 201 languages/dialects claimed; Urdu not named on the card"
  - key: gemma4_e4b
    role: current Gemma family
    confirmatory: true
    backend: vllm
    model_id: google/gemma-4-E4B-it   # card checked 2026-11-13; not gated
    revision: null            # PIN at download
    chat_template_kwargs: {enable_thinking: false}   # Gemma 4 has a configurable reasoning mode
    licence: Apache-2.0
    declared_urdu_support: "unclear - 140+ pre-training languages, 35+ supported; Urdu not named on the card"
  - key: gemma4_31b
    role: EXPLORATORY larger model (only if compute permits; not in the confirmatory families)
    confirmatory: false
    backend: vllm
    model_id: google/gemma-4-31B-it   # NOT YET VERIFIED - confirm repo id and licence before running
    revision: null
    chat_template_kwargs: {enable_thinking: false}
    licence: "Apache-2.0 per the Gemma 4 announcement; repo not checked"
    declared_urdu_support: "unclear"
  - key: fake
    role: TEST ONLY - deterministic echo, never analysed; runs only when named explicitly
    confirmatory: false
    backend: fake
    model_id: fake/echo
