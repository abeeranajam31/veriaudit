# Kaggle free tier (2 x NVIDIA T4, 15 GB each, no bf16) variant of configs/models.yaml for the
# EXPLORATORY v0.1 replication only. Same repos and pinned revisions as configs/models.yaml; differs
# only in hardware settings: float16 instead of bfloat16 (T4 has no bf16), tensor parallel over the
# two T4s. The main study uses configs/models.yaml (bf16), so exploratory and main-study runs are
# never pooled. The exploratory 31B model is omitted (does not fit).
models:
- key: qwen3_8b
  role: historical baseline (v0.1)
  confirmatory: true
  backend: vllm
  model_id: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  chat_template_kwargs:
    enable_thinking: false
  licence: Apache-2.0
  declared_urdu_support: unclear - 119 languages/dialects claimed; Urdu not confirmed in the report text read
  dtype: float16
  tensor_parallel_size: 2
  max_model_len: 4096
  llm_kwargs:
    gpu_memory_utilization: 0.9
- key: aya_expanse_8b
  role: historical baseline (v0.1)
  confirmatory: true
  backend: vllm
  model_id: CohereLabs/aya-expanse-8b
  revision: 5062468bf9bc0c6035fd64e06274333ec127d980
  licence: CC-BY-NC-4.0 (non-commercial; gated on Hugging Face)
  hf_gated: true
  declared_urdu_support: no - 23 languages, Hindi yes, Urdu no
  dtype: float16
  tensor_parallel_size: 2
  max_model_len: 4096
  llm_kwargs:
    gpu_memory_utilization: 0.9
- key: qwen3_5_9b
  role: newer Qwen family
  confirmatory: true
  backend: vllm
  model_id: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
  chat_template_kwargs:
    enable_thinking: false
  licence: Apache-2.0
  declared_urdu_support: unclear - 201 languages/dialects claimed; Urdu not named on the card
  dtype: float16
  tensor_parallel_size: 2
  max_model_len: 4096
  llm_kwargs:
    gpu_memory_utilization: 0.92
    max_num_seqs: 64   # hybrid (Mamba-style) layers: T4 memory holds only ~120 sequence caches; vLLM's default 256 fails
- key: gemma4_e4b
  role: current Gemma family
  confirmatory: true
  backend: vllm
  model_id: google/gemma-4-E4B-it
  revision: 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c
  chat_template_kwargs:
    enable_thinking: false
  licence: Apache-2.0
  declared_urdu_support: unclear - 140+ pre-training languages, 35+ supported; Urdu not named on the card
  dtype: float16
  tensor_parallel_size: 2
  max_model_len: 4096
  llm_kwargs:
    gpu_memory_utilization: 0.9
    attention_backend: FLEX_ATTENTION   # the default Triton kernel needs 96 KB shared memory for head size 512; T4 has 64 KB
- key: fake
  role: TEST ONLY - deterministic echo, never analysed; runs only when named explicitly
  confirmatory: false
  backend: fake
  model_id: fake/echo
