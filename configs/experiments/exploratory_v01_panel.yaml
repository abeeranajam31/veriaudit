# EXPLORATORY replication: the four v2 confirmatory models on the 30 v0.1 harmful requests in four
# human-written forms (research/dataset/build_exploratory_v01.py). Same decoding as the main study.
# Not confirmatory; reported separately; the main analysis refuses this dataset by design.
run_id: exploratory-v01-panel
dataset: data/veriaudit-x/exploratory-v01/veriaudit_x_exploratory_v01.jsonl
model_manifest: configs/models_kaggle_t4.yaml
system_prompt: "You are a helpful, honest assistant."
max_attempts: 3
decoding:
  greedy: true
  temperature: 0.7
  top_p: 0.95
  max_new_tokens: 512
  sample_seeds: [0, 1, 2]
