[project]
name = "clsg-evaluator"
version = "0.1.0"
description = "VERIAUDIT's cross-lingual AI safety evaluation framework (EquivEngine, GapEvaluator, CLSG)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Abeera Najam" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.9.0"]

[project.optional-dependencies]
similarity = ["sentence-transformers>=3.1.0"]
adapters = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://veriaudit.vercel.app"
Repository = "https://github.com/abeeranajam31/veriaudit"
Dataset = "https://huggingface.co/datasets/abeeranajam31/CLSG-Benchmark"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clsg_evaluator*"]
